# Intégration continue — Plateforme de Gestion Immobilière
# Auteur : DIABATE Oumarou — DATACONNECT AFRICA · 05 août 2026
name: CI

on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }

jobs:
  qualite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: immo
          POSTGRES_PASSWORD: immo
          POSTGRES_DB: immo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://immo:immo@localhost:5432/immo_test?schema=public
      JWT_SECRET: ci-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      CLE_CHIFFREMENT: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      PSQL_URL: postgresql://immo:immo@localhost:5432/immo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Migrations + contraintes métier
        run: npx prisma migrate deploy
      - name: Tests unitaires
        run: npm test -- --coverage
      - name: Tests des garde-fous SQL (plafonds légaux, séquestre, signatures)
        run: psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f test/contraintes.test.sql
      - name: Audit de sécurité des dépendances
        run: npm audit --omit=dev --audit-level=high
